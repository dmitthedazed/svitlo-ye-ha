[project]
name = "svitlo-ye-home-assistant"
version = "1.0.0"
description = "Home Assistant integration for Zhytomyroblenergo outage schedules (SvitloYE)"
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PL", "D", "PT"]
ignore = ["D203", "D213", "PLR2004", "PLR0913", "RUF001", "RUF002", "RUF003", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "PLR0915"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant"]
combine-as-imports = true
