name: Помилка
description: Щось не працює або графік показано неправильно
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Що сталося
      description: Що ви зробили, що очікували і що отримали.
    validations:
      required: true
  - type: input
    id: queue
    attributes:
      label: Черга
      description: Номер черги або адреса, наприклад `3.1`.
  - type: input
    id: ha_version
    attributes:
      label: Версія Home Assistant
      placeholder: "2026.10.1"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версія інтеграції
      description: HACS → СвітлоЄ?, або `version` у `manifest.json`.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи
      description: Налаштування → Система → Журнали, записи з `svitlo_ye`.
      render: text
  - type: textarea
    id: screenshot
    attributes:
      label: Скриншот
      description: Для проблем із карткою допоможуть скриншот і YAML картки.
